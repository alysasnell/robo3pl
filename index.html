<title>RoboShip Request Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="rs-css">
:root{
  --brand:#3d7bfb; --brand-eye:#131c2e;
  --ground:#edf0f5; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#e6eaf1;
  --line:#d5dbe6; --line-2:#c1cad9;
  --ink:#141b2b; --ink-2:#4a5570; --ink-3:#79839a;
  --accent:#2f6bf5; --accent-2:#2455cc; --accent-ink:#ffffff; --accent-soft:#e4ecfe;
  --crit:#c8372c; --crit-bg:#fae8e6; --crit-line:#eec5c0;
  --high:#9a5f0d; --high-bg:#f9eeda; --high-line:#e9d2a8;
  --med:#2f7d6e;  --med-bg:#e2f0ec;  --med-line:#bcdbd3;
  --low:#77839a;  --low-bg:#edeff4;  --low-line:#d8dde7;
  --ok:#2c8348; --ok-bg:#e3f1e7; --ok-line:#bedcc7;
  --shadow:0 1px 2px rgba(20,27,43,.05),0 8px 22px rgba(20,27,43,.08);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Archivo",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141b2b; --surface:#1b2436; --surface-2:#212b40; --surface-3:#2a3448;
    --line:#303b52; --line-2:#3f4b66;
    --ink:#e8ecf5; --ink-2:#a4aec6; --ink-3:#7a849c;
    --accent:#5b8dff; --accent-2:#7aa3ff; --accent-ink:#0d1425; --accent-soft:#1c2b4d;
    --crit:#ff7a68; --crit-bg:#3a1e1b; --crit-line:#5c2f28;
    --high:#eaa63f; --high-bg:#382b14; --high-line:#57431f;
    --med:#4fc0aa;  --med-bg:#143029;  --med-line:#22493f;
    --low:#98a3ba;  --low-bg:#232c3e;  --low-line:#333e55;
    --ok:#5cc87a; --ok-bg:#16301f; --ok-line:#274a33;
    --shadow:0 1px 2px rgba(0,0,0,.32),0 8px 22px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"]{
  --ground:#141b2b; --surface:#1b2436; --surface-2:#212b40; --surface-3:#2a3448;
  --line:#303b52; --line-2:#3f4b66;
  --ink:#e8ecf5; --ink-2:#a4aec6; --ink-3:#7a849c;
  --accent:#5b8dff; --accent-2:#7aa3ff; --accent-ink:#0d1425; --accent-soft:#1c2b4d;
  --crit:#ff7a68; --crit-bg:#3a1e1b; --crit-line:#5c2f28;
  --high:#eaa63f; --high-bg:#382b14; --high-line:#57431f;
  --med:#4fc0aa;  --med-bg:#143029;  --med-line:#22493f;
  --low:#98a3ba;  --low-bg:#232c3e;  --low-line:#333e55;
  --ok:#5cc87a; --ok-bg:#16301f; --ok-line:#274a33;
  --shadow:0 1px 2px rgba(0,0,0,.32),0 8px 22px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:13px 0;flex-wrap:wrap}
.mark{flex:none;color:var(--brand);display:block}
.wordmark{display:block;font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.01em;color:var(--brand);line-height:1;margin-bottom:2px}
.brand h1{font-size:clamp(17px,2.2vw,20px);font-weight:700;line-height:1.15}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.who select{padding:6px 9px;font-size:13px}
.who input{padding:6px 9px;font-size:13px;max-width:150px}
.mailpanel{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin-top:16px}
.mp-head{display:flex;gap:10px;align-items:flex-start}
.mp-tick{width:20px;height:20px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;margin-top:1px}
.mp-head b{font-family:var(--display);font-size:15px}
.mp-head p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.mp-sub{display:flex;gap:9px;align-items:baseline;margin:11px 0 12px;padding:8px 11px;background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow-x:auto}
.mp-subject{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.mp-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mp-actions .spacer{flex:1}
.mp-actions a.btn{text-decoration:none}
.delconfirm{font-size:12.5px;color:var(--crit);font-weight:600}
.emailed{display:block;font-family:var(--mono);font-size:11px;color:var(--ok);margin-top:3px;white-space:nowrap}
.sent-yes{color:var(--ok);font-weight:600;font-size:13px}
.sent-no{color:var(--ink-3);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{font-family:var(--display);font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink-2);padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(18,32,30,.10)}
.tabs button:hover{color:var(--ink)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.stat .k{display:block;font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:500;line-height:1.25;display:flex;align-items:baseline;gap:5px}
.stat .v small{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400}
.stat.hot{background:var(--crit-bg);border-color:var(--crit-line)}
.stat.hot .v,.stat.hot .k{color:var(--crit)}
.stat.warm{background:var(--high-bg);border-color:var(--high-line)}
.stat.warm .v,.stat.warm .k{color:var(--high)}

/* ---------- controls ---------- */
.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px 0 0}
.controls.filters{padding:9px 0 13px}
.field{display:flex;align-items:center;gap:6px}
.search{position:relative;flex:1 1 200px;min-width:170px;max-width:420px}
.search input{width:100%;padding:8px 11px 8px 30px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
select,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
select{cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.seg button:hover{color:var(--ink)}
.btn{font-family:var(--display);font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 9px}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn.danger:hover{background:var(--crit-bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:6px 11px}

/* ---------- board ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px}
.scroller{overflow-x:auto}
.grid{display:grid;grid-template-columns:4px 54px 104px minmax(240px,2.4fr) 118px 82px 104px 132px 34px;align-items:center;min-width:900px}
.head{border-bottom:1px solid var(--line);background:var(--surface-2)}
.head .cell{padding:9px 10px}
.head button{all:unset;cursor:pointer;font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.head button:hover{color:var(--ink)}
.head button[data-active="1"]{color:var(--accent-2)}
.head .arrow{font-size:9px;opacity:.9}
.row{border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .cell{padding:11px 10px;min-width:0}
.row .stripe{align-self:stretch;background:var(--low)}
.row[data-p="critical"] .stripe{background:var(--crit)}
.row[data-p="high"] .stripe{background:var(--high)}
.row[data-p="medium"] .stripe{background:var(--med)}
.row[data-p="low"] .stripe{background:var(--low)}
.row[data-done="1"]{background:var(--surface-2)}
.row[data-done="1"] .cell:not(.c-status){opacity:.62}
.row[data-done="1"] .stripe{opacity:.4}
.row[data-sample="1"]{background:repeating-linear-gradient(135deg,transparent,transparent 9px,var(--surface-2) 9px,var(--surface-2) 18px)}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.client{font-weight:600;font-size:14.5px;letter-spacing:-.005em}
.need{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-cell{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.p-critical{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.p-high{color:var(--high);background:var(--high-bg);border-color:var(--high-line)}
.p-medium{color:var(--med);background:var(--med-bg);border-color:var(--med-line)}
.p-low{color:var(--low);background:var(--low-bg);border-color:var(--low-line)}
.s-new{color:var(--ink-2);background:var(--surface-3);border-color:var(--line)}
.s-active{color:var(--med);background:var(--med-bg);border-color:var(--med-line)}
.s-blocked{color:var(--high);background:var(--high-bg);border-color:var(--high-line)}
.s-done{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.age{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
.age b{font-weight:600;color:var(--ink)}
.age.warn b{color:var(--high)}
.age.hot b{color:var(--crit)}
.due{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.due.over{color:var(--crit);font-weight:600}
.tag{display:inline-block;font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.chev{color:var(--ink-3);transition:transform .16s ease;display:block}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.notecount{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;white-space:nowrap}

/* ---------- detail ---------- */
.detail{border-bottom:1px solid var(--line);background:var(--surface-2);padding:16px 18px 18px 18px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:22px}
.detail h3{font-size:12px;font-family:var(--display);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.detail .body{white-space:pre-wrap;font-size:14.5px;max-width:66ch;margin:0 0 16px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;color:var(--ink-2);align-items:baseline}
.meta dt{color:var(--ink-3);font-size:11px;font-family:var(--display);font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.meta dd{margin:0;color:var(--ink)}
.thread{display:flex;flex-direction:column;gap:9px;margin:0 0 14px}
.note{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:6px;padding:8px 11px}
.note .n-head{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.note .n-head b{color:var(--ink);font-size:12.5px;font-weight:600}
.note p{margin:0;font-size:14px;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:14px;margin-top:2px;border-top:1px solid var(--line)}
.actions .spacer{flex:1}
textarea.inp{width:100%;resize:vertical;min-height:64px;line-height:1.5}

/* ---------- empty ---------- */
.empty{padding:52px 24px;text-align:center}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:46ch;color:var(--ink-2);font-size:14px}
.empty .btn{margin:0 4px}

/* ---------- form ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:24px;max-width:760px;margin:18px auto 30px}
.panel>header{margin-bottom:18px}
.panel h2{font-size:20px;font-weight:700}
.panel>header p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;max-width:58ch}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.lab{display:block;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
label.lab span{color:var(--ink-3);text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:400;font-size:11.5px;margin-left:5px}
.f-full{grid-column:1/-1}
.inp{width:100%}
.inp:focus{border-color:var(--accent)}
.prios{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prio{border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;background:var(--surface);display:block;transition:border-color .12s,background .12s}
.prio:hover{border-color:var(--line-2)}
.prio input{position:absolute;opacity:0;pointer-events:none}
.prio .pn{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:13.5px}
.prio .dot{width:9px;height:9px;border-radius:2px;flex:none}
.prio .ph{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:3px}
.prio[data-on="1"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.prio[data-k="critical"]{color:var(--crit)} .prio[data-k="critical"] .dot{background:var(--crit)}
.prio[data-k="high"]{color:var(--high)} .prio[data-k="high"] .dot{background:var(--high)}
.prio[data-k="medium"]{color:var(--med)} .prio[data-k="medium"] .dot{background:var(--med)}
.prio[data-k="low"]{color:var(--low)} .prio[data-k="low"] .dot{background:var(--low)}
.prio[data-on="1"] .pn,.prio[data-on="1"] .ph{color:inherit}
.prio .pn,.prio .ph{color:var(--ink)}
.prio .ph{color:var(--ink-3)}
.form-foot{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.form-foot .hint{font-size:12.5px;color:var(--ink-3);flex:1}
.err{color:var(--crit);font-size:12.5px;margin-top:5px;display:none}
.err[data-on="1"]{display:block}
.inp[aria-invalid="true"]{border-color:var(--crit)}

/* ---------- misc ---------- */
.banner{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--high-line);background:var(--high-bg);color:var(--high);border-radius:8px;padding:9px 13px;font-size:13px;margin:14px 0 0}
.banner b{font-weight:600}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:60;max-width:min(520px,90vw);text-align:center}
.toast[data-on="1"]{opacity:1;transform:translateX(-50%) translateY(0)}
.toast[data-kind="warn"]{background:var(--crit);color:#fff}
.saving{font-size:12px;color:var(--ink-3);display:none;align-items:center;gap:6px}
.saving[data-on="1"]{display:inline-flex}
.spin{width:11px;height:11px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.foot{padding:6px 0 34px;color:var(--ink-3);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.controls-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.count{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- narrow ---------- */
@media (max-width:940px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{display:block;min-width:0}
  .head{display:none}
  .grid.row{display:grid;grid-template-columns:4px auto auto auto 1fr;grid-template-rows:auto auto auto;column-gap:11px;padding-right:13px;align-items:center}
  .row .stripe{grid-column:1;grid-row:1/4}
  .row .cell{padding:0}
  .row .c-num{grid-column:2;grid-row:1;padding:11px 0 0;display:flex;gap:7px;align-items:center}
  .row .c-prio{grid-column:3/6;grid-row:1;padding:11px 0 0;justify-self:start}
  .row .c-main{grid-column:2/6;grid-row:2;padding:5px 0 0}
  .need{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .row .c-who,.row .c-age,.row .c-due{grid-row:3;padding:9px 0 12px;align-self:start}
  .row .c-who{grid-column:2}
  .row .c-age{grid-column:3}
  .row .c-due{grid-column:4}
  .row .c-status{grid-column:5;grid-row:3;padding:9px 0 12px;justify-self:start;align-self:start}
  .notecount{display:inline;margin-left:6px}
  .emailed{display:inline;margin-left:8px}
  .row .c-chev{display:none}
  .detail-grid{grid-template-columns:1fr;gap:16px}
  .form-grid{grid-template-columns:1fr}
  .prios{grid-template-columns:1fr 1fr}
  .top-in{gap:10px}
}
@media (max-width:560px){
  .wrap{padding:0 13px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .panel{padding:17px}
}
</style>

<div id="app"></div>

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function byId(id){ return document.getElementById(id); }
function prioName(k){ for(var i=0;i<PRIOS.length;i++) if(PRIOS[i].k===k) return PRIOS[i].n; return k; }
function statusName(k){ for(var i=0;i<STATUSES.length;i++) if(STATUSES[i].k===k) return STATUSES[i].n; return k; }
function isOpen(it){ return it.status !== "done"; }
function days(fromIso){
  var t = Date.parse(fromIso);
  if(isNaN(t)) return 0;
  return Math.max(0, Math.floor((Date.now()-t)/86400000));
}
function fmtDate(isoStr){
  var d = new Date(isoStr);
  if(isNaN(d.getTime())) return "";
  var now = new Date();
  var opts = {month:"short",day:"numeric"};
  if(d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined,opts);
}
function fmtDateTime(isoStr){
  var d = new Date(isoStr);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + ", " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function dueDate(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDue(s){
  var d = dueDate(s);
  if(!d) return "";
  var opts = {month:"short",day:"numeric"};
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined,opts);
}
function isOverdue(it){
  var d = dueDate(it.due);
  if(!d || !isOpen(it)) return false;
  var today = new Date(); today.setHours(0,0,0,0);
  return d < today;
}

function cap(){
  if(!capPromise){
    capPromise = (window.claude && window.claude.use)
      ? Promise.resolve(window.claude.use("artifact")).catch(function(){ return null; })
      : Promise.resolve(null);

}
function setSaving(on){
  var el = byId("saving");
  if(el) el.setAttribute("data-on", on ? "1" : "0");
}
var toastTimer = null;
function toast(msg, kind){
  var el = byId("toast");
  if(!el) return;
  el.textContent = msg;
  el.setAttribute("data-kind", kind || "ok");
  el.setAttribute("data-on","1");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.setAttribute("data-on","0"); }, 4200);
}
function commit(mutator, okMsg){
  var snapshot = JSON.stringify(state);
  mutator(state);
  renderAll();
  setSaving(true);
  cap().then(function(api){
    if(!api){
      setSaving(false);
      localOnly = true;
      renderAll();
      toast("This view can't write to the shared board, so the change stayed on your screen only.","warn");
      return null;
    }
    return api.publish(renderDoc(state)).then(function(){
      setSaving(false);
      toast(okMsg || "Saved for the whole team.");
    });
  }).catch(function(err){
    setSaving(false);
    var code = (err && err.code) || "upstream_error";
    if(code === "conflict"){
      toast("Someone saved first — loading their version now.","warn");
      return;
    }
    state = JSON.parse(snapshot);
    if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
      readOnly = true;
      toast("You have view-only access to this board, so nothing was saved. Ask for edit access to submit.","warn");
    } else if(code === "rate_limited"){
      toast("Saves are coming in too fast. Wait a few seconds and try again.","warn");
    } else if(code === "too_large"){
      toast("The board is full. Delete some resolved requests, then try again.","warn");
    } else if(code === "invalid_content" || code === "transform_error"){
      toast("The board couldn't be saved. Reload the page and try again.","warn");
    } else {
      toast("Couldn't reach the server. Check your connection and try again.","warn");
    }
    renderAll();
  });
}

function emailBody(it, full){

  var lines = [
    "Priority: " + prioName(it.priority),

  if(it.due) lines.push("Needed by: " + fmtDue(it.due));

  lines.push("What they need:");

  return lines.join("\n");

/* ---------------- sorting + filtering ---------------- */
function cmpFor(key){
  switch(key){
    case "waiting":  return function(a,b){ return Date.parse(a.createdAt) - Date.parse(b.createdAt); };
    case "created":  return function(a,b){ return Date.parse(b.createdAt) - Date.parse(a.createdAt); };
    case "client":   return function(a,b){ return String(a.client).toLowerCase().localeCompare(String(b.client).toLowerCase()); };
    case "requester":return function(a,b){ return String(a.requester).toLowerCase().localeCompare(String(b.requester).toLowerCase()); };
    case "status":   return function(a,b){ return STATUS_RANK[a.status] - STATUS_RANK[b.status]; };
    case "num":      return function(a,b){ return b.num - a.num; };
    case "due":      return function(a,b){
      var da = dueDate(a.due), db = dueDate(b.due);
      if(!da && !db) return 0;
      if(!da) return 1;
      if(!db) return -1;
      return da - db;
    };
    default:         return function(a,b){ return PRIO_RANK[a.priority] - PRIO_RANK[b.priority]; };
  }
}
function visibleItems(){
  var q = (prefs.q||"").trim().toLowerCase();
  var list = allItems().filter(function(it){
    if(prefs.view === "open" && !isOpen(it)) return false;
    if(prefs.view === "done" && isOpen(it)) return false;
    if(prefs.client && it.client !== prefs.client) return false;
    if(prefs.prio && it.priority !== prefs.prio) return false;
    if(q){
      var hay = [it.client,it.requester,it.need,it.ref,("#"+it.num)].join(" ").toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  var base = cmpFor(prefs.sort);
  var tie = function(a,b){ return Date.parse(a.createdAt) - Date.parse(b.createdAt); };
  list.sort(function(a,b){
    if(prefs.sort !== "status"){
      var ao = isOpen(a) ? 0 : 1, bo = isOpen(b) ? 0 : 1;
      if(ao !== bo) return ao - bo;
    }
    var r = base(a,b);
    if(prefs.dir === "rev") r = -r;
    return r !== 0 ? r : tie(a,b);
  });
  return list;
}
function activeFilters(){
  return !!((prefs.q && prefs.q.trim()) || prefs.client || prefs.prio || prefs.view !== "open");
}
function clients(){
  var seen = {}, out = [];
  allItems().forEach(function(it){ if(it.client && !seen[it.client]){ seen[it.client]=1; out.push(it.client); } });
  out.sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
  return out;
}

function statsHTML(){
  var items = allItems();
  var open = items.filter(isOpen);
  var crit = open.filter(function(i){ return i.priority === "critical"; }).length;
  var oldest = 0;
  open.forEach(function(i){ var d = days(i.createdAt); if(d > oldest) oldest = d; });
  var weekAgo = Date.now() - 7*86400000;
  var closed = items.filter(function(i){ return !isOpen(i) && Date.parse(i.updatedAt||i.createdAt) >= weekAgo; }).length;
  function tile(k,v,unit,cls){
    return '<div class="stat' + (cls?" "+cls:"") + '"><span class="k">' + k + '</span>' +
      '<span class="v">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</span></div>';
  }
  return '<div class="wrap"><div class="stats">' +
    tile("Open requests", open.length, open.length === 1 ? "request" : "requests", "") +
    tile("Critical", crit, crit === 1 ? "waiting" : "waiting", crit > 0 ? "hot" : "") +
    tile("Longest wait", oldest, oldest === 1 ? "day" : "days", oldest >= 7 ? "hot" : (oldest >= 4 ? "warm" : "")) +
    tile("Resolved this week", closed, "", "") +
  '</div></div>';
}

    (activeFilters() ? '<button class="btn ghost sm" data-act="clearfilters">Clear filters</button>' : '') +
  '</div></div>';
}
function headHTML(){
  function h(key,label,cls){
    var on = prefs.sort === key;
    var arrow = on ? '<span class="arrow">' + (prefs.dir==="rev" ? "▲" : "▼") + '</span>' : "";
    return '<div class="cell ' + cls + '"><button data-act="sort" data-sort="' + key + '" data-active="' + (on?1:0) + '"' +
      ' aria-label="Sort by ' + label + '">' + label + arrow + '</button></div>';
  }
  return '<div class="grid head" role="row">' +
    '<div class="cell"></div>' +
    h("num","#","c-num") +
    h("priority","Priority","c-prio") +
    h("client","Client &amp; request","c-main") +
    h("requester","From","c-who") +
    h("waiting","Waiting","c-age") +
    h("due","Needed by","c-due") +
    h("status","Status","c-status") +

  '</div>';
}
function listHTML(){
  var list = visibleItems();
  if(!list.length) return emptyHTML();
  return list.map(rowHTML).join("");
}
function emptyHTML(){
  var total = state.items.length;
  if(total === 0 && !previewOn){
    return '<div class="empty"><h2>Nothing in the queue yet</h2>' +
      '<p>When someone on the team is waiting on Glen for something, they add it here — client, what they need, and how urgent it is. Everything lands on this board, worst first.</p>' +
      '<button class="btn primary" data-act="tab" data-tab="submit">Add the first request</button>' +
      '<button class="btn" data-act="preview">Show me an example</button></div>';
  }
  if(total === 0 && previewOn){
    return "";
  }
  return '<div class="empty"><h2>Nothing matches those filters</h2>' +
    '<p>There are ' + total + ' request' + (total===1?"":"s") + ' on the board. Try widening the view or clearing the search.</p>' +
    '<button class="btn" data-act="clearfilters">Clear filters</button></div>';
}
function rowHTML(it){
  var open = !!expanded[it.id];
  var age = days(it.createdAt);
  var ageCls = !isOpen(it) ? "" : (age >= 7 || (it.priority === "critical" && age >= 2) ? "hot" : (age >= 4 ? "warn" : ""));
  var overdue = isOverdue(it);
  var notes = (it.notes && it.notes.length) || 0;
  var row = '<div class="grid row" role="row" tabindex="0" data-act="expand" data-id="' + esc(it.id) + '" data-p="' + esc(it.priority) + '"' +
      ' data-done="' + (isOpen(it) ? 0 : 1) + '" data-sample="' + (it.sample?1:0) + '" aria-expanded="' + open + '">' +
    '<div class="stripe"></div>' +
    '<div class="cell c-num"><span class="num">' + (it.sample ? "—" : "#" + it.num) + '</span>' +
      (it.sample ? '<span class="tag">Example</span>' : "") + '</div>' +
    '<div class="cell c-prio"><span class="pill p-' + esc(it.priority) + '">' + prioName(it.priority) + '</span></div>' +
    '<div class="cell c-main"><div class="client">' + esc(it.client) +
      (it.ref ? '<span class="tag">' + esc(it.ref) + '</span>' : "") + '</div>' +

    '<div class="cell c-who"><span class="who-cell">' + esc(it.requester) + '</span></div>' +

    '<div class="cell c-due"><span class="due' + (overdue ? " over" : "") + '">' + (it.due ? fmtDue(it.due) + (overdue ? " ⚠" : "") : "—") + '</span></div>' +
    '<div class="cell c-status"><span class="pill s-' + esc(it.status) + '">' + statusName(it.status) + '</span>' +

    '<div class="cell c-chev"><svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
      '<path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +

  return row + (open ? detailHTML(it) : "");

  var noteBox = noteOpen[it.id]

  return '<div class="detail">' +

          (it.ref ? '<dt>Order / ref</dt><dd class="mono">' + esc(it.ref) + '</dd>' : "") +
          (it.due ? '<dt>Needed by</dt><dd class="mono' + (isOverdue(it) ? " due over" : "") + '">' + fmtDue(it.due) + '</dd>' : "") +
          '<dt>Last update</dt><dd class="mono">' + fmtDateTime(it.updatedAt || it.createdAt) + '</dd>' +
          '<dt>Email to Glen</dt><dd>' + (it.emailedAt
            ? '<span class="sent-yes">✉ Sent' + (it.emailedBy ? ' by ' + esc(it.emailedBy) : '') + '</span><br><span class="mono" style="font-size:12px;color:var(--ink-3)">' + fmtDateTime(it.emailedAt) + '</span>'
            : '<span class="sent-no">Not marked as sent</span>') + '</dd>' +

    '<div class="actions">' +
      (canEdit
        ? '<label class="eyebrow" for="st-' + esc(it.id) + '">Status</label>' +
          '<select id="st-' + esc(it.id) + '" data-act="status" data-id="' + esc(it.id) + '">' + statusOpts + '</select>' +
          '<label class="eyebrow" for="pr-' + esc(it.id) + '" style="margin-left:8px">Priority</label>' +
          '<select id="pr-' + esc(it.id) + '" data-act="reprio" data-id="' + esc(it.id) + '">' +
            PRIOS.map(function(p){ return '<option value="' + p.k + '"' + (it.priority===p.k?" selected":"") + '>' + p.n + '</option>'; }).join("") +
          '</select>' +
          '<span class="spacer"></span>' +
          '<button class="btn sm" data-act="mail-row" data-id="' + esc(it.id) + '">Email Glen</button>' +
          (it.emailedAt ? '' : '<button class="btn sm" data-act="mail-mark" data-id="' + esc(it.id) + '">Mark emailed</button>') +
          (isOpen(it)
            ? '<button class="btn sm" data-act="resolve" data-id="' + esc(it.id) + '">Mark resolved</button>'
            : '<button class="btn sm" data-act="reopen" data-id="' + esc(it.id) + '">Reopen</button>') +
          (confirmDel === it.id
            ? '<span class="delconfirm">Delete #' + it.num + ' for everyone?</span>' +
              '<button class="btn sm danger" data-act="del-yes" data-id="' + esc(it.id) + '">Yes, delete</button>' +
              '<button class="btn ghost sm" data-act="del-no" data-id="' + esc(it.id) + '">Keep it</button>'
            : '<button class="btn ghost sm danger" data-act="del" data-id="' + esc(it.id) + '">Delete</button>')
        : '<span style="font-size:12.5px;color:var(--ink-3)">' + (it.sample ? "Example row — not saved to the board." : "View only — you can’t change this request.") + '</span>') +

  '</div>';
}

/* ---------------- events ---------------- */
function bind(){
  var app = byId("app");
  app.addEventListener("click", onClick);
  app.addEventListener("change", onChange);
  app.addEventListener("input", onInput);
  app.addEventListener("keydown", onKeydown);
  var form = byId("rs-form");
  if(form) form.addEventListener("submit", function(e){ e.preventDefault(); submitForm(); });
}
function closestAct(el){
  while(el && el !== document){
    if(el.getAttribute && el.getAttribute("data-act")) return el;
    el = el.parentNode;
  }
  return null;
}
function onKeydown(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var t = e.target;
  if(t && t.classList && t.classList.contains("row")){
    e.preventDefault();
    toggle(t.getAttribute("data-id"));
  }
}
function toggle(id){
  if(confirmDel && confirmDel !== id) confirmDel = null;
  if(expanded[id]){ delete expanded[id]; if(confirmDel === id) confirmDel = null; } else expanded[id] = true;
  renderAll();
}
function onClick(e){
  var el = closestAct(e.target);
  if(!el) return;
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");

  if(act === "expand"){
    if(e.target.closest && e.target.closest("button,select,textarea,a")) return;
    toggle(id); return;
  }
  if(act === "tab"){ prefs.tab = el.getAttribute("data-tab"); savePrefs(); renderAll(); window.scrollTo(0,0); return; }
  if(act === "view"){ prefs.view = el.getAttribute("data-view"); savePrefs(); renderAll(); return; }
  if(act === "dir"){ prefs.dir = prefs.dir === "rev" ? "nat" : "rev"; savePrefs(); renderAll(); return; }
  if(act === "sort"){
    var k = el.getAttribute("data-sort");
    if(prefs.sort === k) prefs.dir = prefs.dir === "rev" ? "nat" : "rev";
    else { prefs.sort = k; prefs.dir = "nat"; }
    savePrefs(); renderAll(); return;
  }
  if(act === "preview"){ previewOn = true; renderAll(); return; }
  if(act === "clearfilters"){ prefs.q = ""; prefs.client = ""; prefs.prio = ""; prefs.view = "open"; savePrefs(); renderAll(); return; }
  if(act === "csv"){ exportCsv(); return; }
  if(act === "cancel-form"){ prefs.draft = {}; savePrefs(); prefs.tab = "queue"; renderAll(); return; }
  if(act === "note-open"){ noteOpen[id] = true; renderAll(); var t = byId("note-"+id); if(t) t.focus(); return; }
  if(act === "note-cancel"){ delete noteOpen[id]; renderAll(); return; }
  if(act === "note-save"){ saveNote(id); return; }
  if(act === "mail-done"){ clearPending(); renderAll(); return; }
  if(act === "mail-sent"){ markEmailed(id); return; }
  if(act === "mail-mark"){ markEmailed(id); return; }
  if(act === "mail-copy"){ var mi = find(id); if(mi) copyMail(mi); return; }
  if(act === "mail-again"){ return; }
  if(act === "mail-row"){ var ri = find(id); if(ri) openMail(ri); return; }
  if(act === "resolve"){ setStatus(id, "done"); return; }
  if(act === "reopen"){ setStatus(id, "active"); return; }
  if(act === "del"){ confirmDel = id; renderAll(); return; }
  if(act === "del-no"){ confirmDel = null; renderAll(); return; }
  if(act === "del-yes"){
    confirmDel = null;
    commit(function(s){
      s.items = s.items.filter(function(x){ return x.id !== id; });
    }, "Request deleted.");
    return;
  }
}
function onChange(e){
  var el = e.target;
  var act = el.getAttribute && el.getAttribute("data-act");
  if(el.id === "f-client"){ prefs.client = el.value; savePrefs(); renderAll(); return; }
  if(el.id === "f-prio"){ prefs.prio = el.value; savePrefs(); renderAll(); return; }
  if(el.id === "f-sort"){ prefs.sort = el.value; prefs.dir = "nat"; savePrefs(); renderAll(); return; }
  if(act === "status"){ setStatus(el.getAttribute("data-id"), el.value); return; }
  if(act === "reprio"){
    var id = el.getAttribute("data-id"), v = el.value;
    commit(function(s){
      var it = findIn(s, id);
      if(it){ it.priority = v; it.updatedAt = new Date().toISOString(); }
    }, "Priority updated.");
    return;
  }
  if(el.id === "f-name" || el.id === "f-client-in"){
    var otherId = el.id === "f-name" ? "f-name-other" : "f-client-other";
    var other = byId(otherId);
    if(other){
      if(el.value === "__other"){ other.hidden = false; other.focus(); }
      else { other.hidden = true; other.value = ""; }
    }
    var eid = el.id === "f-name" ? "e-name" : "e-client";
    var eb = byId(eid); if(eb) eb.setAttribute("data-on","0");
    el.setAttribute("aria-invalid","false");
    saveDraft();
    return;
  }
  if(el.id === "whoami-other"){
    var nv = el.value.trim().slice(0,40);
    if(nv){ prefs.name = nv; savePrefs(); }
    renderAll();
    return;
  }
  if(el.id === "whoami"){
    if(el.value === "__other"){
      var wi = byId("whoami-other");
      if(wi){ wi.hidden = false; wi.focus(); }
      return;
    }
    prefs.name = el.value;
    savePrefs();
    renderAll();
    return;
  }
  if(el.name === "prio"){
    var wrap = el.closest(".prios");
    if(wrap) Array.prototype.forEach.call(wrap.querySelectorAll(".prio"), function(l){
      l.setAttribute("data-on", l.querySelector("input").checked ? "1" : "0");
    });
    saveDraft();
    var err = byId("e-prio"); if(err) err.setAttribute("data-on","0");
    return;
  }
}
function onInput(e){
  var el = e.target;
  if(el.id === "q"){ prefs.q = el.value; savePrefs(); renderAll(); return; }
  if(el.id === "whoami-other"){ return; }
  if(el.id && el.id.indexOf("f-") === 0){
    saveDraft();
    var map = {"f-name":"e-name","f-name-other":"e-name","f-client-in":"e-client","f-client-other":"e-client","f-need":"e-need"};
    if(map[el.id]){
      var err = byId(map[el.id]);
      if(err) err.setAttribute("data-on","0");
      el.setAttribute("aria-invalid","false");
    }
  }
}
function saveDraft(){
  var f = byId("rs-form");
  if(!f) return;
  var checked = f.querySelector('input[name="prio"]:checked');
  prefs.draft = {
    requester: pickVal("f-name","f-name-other"),
    client: pickVal("f-client-in","f-client-other"),
    need: val("f-need"),
    ref: val("f-ref"),
    due: val("f-due"),
    priority: checked ? checked.value : ""
  };
  savePrefs();
}
function val(id){ var el = byId(id); return el ? el.value : ""; }
function pickVal(selId, otherId){
  var sel = byId(selId);
  if(!sel) return "";
  if(sel.value === "__other"){ var o = byId(otherId); return o ? o.value : ""; }
  return sel.value;
}
function find(id){ return findIn(state, id); }
function findIn(s, id){
  for(var i=0;i<s.items.length;i++) if(s.items[i].id === id) return s.items[i];
  return null;
}

/* ---------------- actions ---------------- */
function whoAmI(){
  if(prefs.name) return prefs.name;
  var sel = byId("whoami");
  if(sel && sel.focus) sel.focus();
  return null;
}
function setStatus(id, next){
  var it = find(id);
  if(!it || it.status === next) return;
  commit(function(s){
    var t = findIn(s, id);
    if(!t) return;
    t.status = next;
    t.updatedAt = new Date().toISOString();
  }, next === "done" ? "Marked resolved." : "Status updated to “" + statusName(next) + "”.");
}
function saveNote(id){
  var box = byId("note-" + id);
  if(!box) return;
  var text = box.value.trim();
  if(!text){ box.focus(); return; }
  var who = whoAmI();
  if(!who){ toast("Choose your name in the top bar first, so the note is attributed.","warn"); return; }
  delete noteOpen[id];
  commit(function(s){
    var t = findIn(s, id);
    if(!t) return;
    t.notes = t.notes || [];
    t.notes.push({by:who, text:text, at:new Date().toISOString()});
    t.updatedAt = new Date().toISOString();
  }, "Note posted.");
}
function submitForm(){
  var f = byId("rs-form");
  if(!f) return;
  var checked = f.querySelector('input[name="prio"]:checked');
  var data = {
    requester: pickVal("f-name","f-name-other").trim(),
    client: pickVal("f-client-in","f-client-other").trim(),
    need: val("f-need").trim(),
    ref: val("f-ref").trim(),
    due: val("f-due"),
    priority: checked ? checked.value : ""
  };
  var bad = null;
  function flag(inputId, errId){
    var err = byId(errId); if(err) err.setAttribute("data-on","1");
    var inp = byId(inputId); if(inp){ inp.setAttribute("aria-invalid","true"); }
    if(!bad) bad = inp;
  }
  if(!data.requester) flag("f-name","e-name");
  if(!data.client) flag("f-client-in","e-client");
  if(!data.need) flag("f-need","e-need");
  if(!data.priority) flag(null,"e-prio");
  if(bad){ bad.focus(); return; }
  if(!data.priority){ toast("Pick a priority so Glen can order the queue.","warn"); return; }

  prefs.name = data.requester;
  prefs.draft = {};
  prefs.tab = "queue";
  prefs.view = "open";
  savePrefs();
  previewOn = false;
  var now = new Date().toISOString();
  var item = {
    id: uid(), num: state.seq || 1,
    client: data.client, requester: data.requester,
    priority: data.priority, status: "new",
    need: data.need, ref: data.ref, due: data.due,
    createdAt: now, updatedAt: now, notes: []
  };
  openMail(item);
  stashPending(item.id);
  commit(function(s){
    item.num = s.seq || 1;
    s.seq = item.num + 1;
    s.items.push(item);
  }, "Sent to the board.");
  window.scrollTo(0,0);
}
function exportCsv(){
  var rows = visibleItems().filter(function(i){ return !i.sample; });
  if(!rows.length){ toast("Nothing to export in this view.","warn"); return; }
  var head = ["Request #","Priority","Status","Client","Submitted by","What they need","Order/ref","Needed by","Submitted","Days waiting","Emailed Glen","Notes"];
  function cell(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }
  var lines = [head.map(cell).join(",")];
  rows.forEach(function(it){
    lines.push([
      it.num, prioName(it.priority), statusName(it.status), it.client, it.requester,
      it.need, it.ref, it.due, new Date(it.createdAt).toISOString().slice(0,10),
      isOpen(it) ? days(it.createdAt) : "",
      it.emailedAt ? new Date(it.emailedAt).toISOString().slice(0,16).replace("T"," ") : "no",
      (it.notes||[]).map(function(n){ return n.by + ": " + n.text; }).join(" | ")
    ].map(cell).join(","));
  });
  var csv = lines.join("\r\n");
  var n = rows.length;
  function done(){
    toast(n + " request" + (n===1?"":"s") + " copied — paste into Excel or Sheets.");
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = csv;
    ta.setAttribute("readonly","");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(ok) done();
    else toast("Couldn’t copy from this view. Try selecting the rows by hand.","warn");
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(csv).then(done, fallback);
  } else fallback();
}

/* ---------------- go ---------------- */
renderAll();
cap();
})();
</script>
